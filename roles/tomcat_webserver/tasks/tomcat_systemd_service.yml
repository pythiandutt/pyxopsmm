---
- name: Find the actual JDK path
  find:
    paths: /usr/lib/jvm
    recurse: true
    patterns:
      - "jdk-{{ tomcat_java_version }}*"   # Common for Oracle JDK
      - "java-{{ tomcat_java_version }}*"  # Common for OpenJDK
    file_type: directory
  register: found_java

- name: Set tomcat_java_home dynamically
  set_fact:
    tomcat_java_home: "{{ found_java.files[0].path }}"
  when: found_java.matched > 0

- name: Create a systemd service for Tomcat
  template:
    src: "{{ tomcat_systemd_service }}.j2"
    dest: "/etc/systemd/system/{{ tomcat_systemd_service }}"
    mode: "u=rw,go="

- name: Enable and start Tomcat service
  systemd:
    name: "{{ tomcat_systemd_service }}"
    state: started
    enabled: true
    daemon_reload: true
