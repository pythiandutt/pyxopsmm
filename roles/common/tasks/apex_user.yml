---
- name: Check APEX user existence
  shell: |
    set -o pipefail
    {{ oracle_home }}/bin/sqlplus -s -L / as sysdba <<-'END_HEREDOC'
    SET heading off pages 0 feedback off serveroutput on
    WHENEVER SQLERROR EXIT SQL.SQLCODE
    
    ALTER SESSION SET CONTAINER = {{ oracle_pdb_name | default('APEX') }};
    
    DECLARE
      v_schema    VARCHAR2(128);
      v_prefix    VARCHAR2(10) := 'false';
      -- Move Jinja parsing completely out of the dynamic execution lines:
      v_workspace VARCHAR2(255) := '{{ item.workspace_name }}';
      v_username  VARCHAR2(255) := '{{ item.user_name }}';
    BEGIN
      -- 1. Dynamically find the active APEX database schema owner
      SELECT username INTO v_schema 
        FROM all_users 
       WHERE (username LIKE 'APEX_%' OR username = 'APEX_INSTANCE_ADMIN')
         AND ROWNUM = 1;

      -- 2. Execute the user check safely using the real schema name context
      EXECUTE IMMEDIATE 'ALTER SESSION SET CURRENT_SCHEMA = ' || v_schema;
      
      EXECUTE IMMEDIATE 'BEGIN APEX_UTIL.set_security_group_id(APEX_UTIL.find_security_group_id(:1)); END;' 
        USING v_workspace;
        
      EXECUTE IMMEDIATE 'SELECT NVL(MAX(''true''), ''false'') FROM apex_workspace_apex_users WHERE workspace_name = :1 AND user_name = :2'
        INTO v_prefix
        USING v_workspace, v_username;
        
      DBMS_OUTPUT.PUT_LINE(v_prefix);
    EXCEPTION
      WHEN OTHERS THEN
        DBMS_OUTPUT.PUT_LINE('false');
    END;
    /
    END_HEREDOC
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
    ORACLE_PDB_SID: "{{ oracle_pdb_name }}"
    PATH: "{{ oracle_home }}/bin:/usr/local/bin:/bin:/usr/bin:/usr/local/sbin:/usr/sbin"
  become: true
  become_user: "{{ oracle_user }}"
  changed_when: false
  register: check_apex_user
  loop: "{{ passed_list }}"
  loop_control:
    label: "{{ item.workspace_name }},{{ item.user_name }}"

- name: Add APEX user
  shell: |
    set -o pipefail
    source oraenv <<< {{ oracle_sid }} 1>/dev/null
    {{ oracle_home }}/bin/sqlplus -s -L / as sysdba <<-'END_HEREDOC'
    WHENEVER SQLERROR EXIT SQL.SQLCODE
    BEGIN
       APEX_UTIL.set_security_group_id(APEX_UTIL.find_security_group_id(p_workspace=>'{{ item.wksp.workspace_name }}'));
       APEX_UTIL.create_user(
          p_user_name => '{{ item.wksp.user_name }}',
          p_email_address => '{{ item.wksp.user_email }}',
          p_web_password => '{{ item.wksp.user_pass }}',
          p_developer_privs => '{{ item.wksp.apex_role }}',
          p_default_schema => '{{ item.wksp.default_schema }}',
          p_default_date_format => '{{ item.wksp.default_date_format }}',
          p_change_password_on_first_use => 'Y'
       );
       commit;
    END;
    /
    END_HEREDOC
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
    ORACLE_PDB_SID: "{{ oracle_pdb_name }}"
    PATH: "{{ oracle_home }}/bin:/usr/local/bin:/bin:/usr/bin:/usr/local/sbin:/usr/sbin"
  become: true
  become_user: "{{ oracle_user }}"
  when:
    - item.wksp.state | lower == "present"
    - item.user_found is search("FALSE")
  loop: "{{ check_apex_user | json_query('results[*].{wksp:item,user_found:stdout}') }}"
  loop_control:
    label: "{{ item.wksp.workspace_name }},{{ item.wksp.user_name }},{{ item.wksp.user_email }},{{ item.wksp.apex_role }},{{ item.wksp.default_schema }},{{ item.wksp.default_date_format }}"

- name: Remove APEX user
  shell: |
    set -o pipefail
    source oraenv <<< {{ oracle_sid }} 1>/dev/null
    {{ oracle_home }}/bin/sqlplus -s -L / as sysdba <<-'END_HEREDOC'
    WHENEVER SQLERROR EXIT SQL.SQLCODE
    BEGIN
       APEX_UTIL.set_security_group_id(APEX_UTIL.find_security_group_id(p_workspace=>'{{ item.wksp.workspace_name }}'));
       APEX_UTIL.remove_user(p_user_name => '{{ item.wksp.user_name }}');
       commit;
    END;
    /
    END_HEREDOC
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
    ORACLE_PDB_SID: "{{ oracle_pdb_name }}"
    PATH: "{{ oracle_home }}/bin:/usr/local/bin:/bin:/usr/bin:/usr/local/sbin:/usr/sbin"
  become: true
  become_user: "{{ oracle_user }}"
  when:
    - item.wksp.state | lower == "absent"
    - item.user_found is search("TRUE")
  loop: "{{ check_apex_user | json_query('results[*].{wksp:item,user_found:stdout}') }}"
  loop_control:
    label: "{{ item.wksp.workspace_name }},{{ item.wksp.user_name }}"
