---
- name: Check Oracle Database schema privilege existence
  shell: |
    set -o pipefail
    source oraenv <<< {{ oracle_sid }} 1>/dev/null
    {{ oracle_home }}/bin/sqlplus -s -L / as sysdba <<-'END_HEREDOC'
    WHENEVER SQLERROR EXIT SQL.SQLCODE
    SET heading off pages 0
    SELECT NVL(MAX(true),false)
      FROM dba_schema_privs
     WHERE privilege = '{{ item.sys_priv }}' COLLATE binary_ci
       AND schema = '{{ item.schema_name }}' COLLATE binary_ci
       AND grantee = '{{ item.grantee }}' COLLATE binary_ci;
    END_HEREDOC
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
    ORACLE_PDB_SID: "{{ oracle_pdb_name }}"
    PATH: "{{ oracle_home }}/bin:/usr/local/bin:/bin:/usr/bin:/usr/local/sbin:/usr/sbin"
  become: true
  become_user: "{{ oracle_user }}"
  changed_when: false
  register: check_oracle_schema_privs
  loop: "{{ passed_list }}"

- name: Add Oracle Database schema privilege
  shell: |
    set -o pipefail
    source oraenv <<< {{ oracle_sid }} 1>/dev/null
    {{ oracle_home }}/bin/sqlplus -s -L / as sysdba <<-'END_HEREDOC'
    WHENEVER SQLERROR EXIT SQL.SQLCODE
    GRANT {{ item.schemapriv.sys_priv }} ON SCHEMA {{ item.schemapriv.schema_name }} TO {{ item.schemapriv.grantee }} {{ item.schemapriv.grant_options }};
    END_HEREDOC
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
    ORACLE_PDB_SID: "{{ oracle_pdb_name }}"
    PATH: "{{ oracle_home }}/bin:/usr/local/bin:/bin:/usr/bin:/usr/local/sbin:/usr/sbin"
  become: true
  become_user: "{{ oracle_user }}"
  when:
    - item.schemapriv.state | lower == "present"
    - not item.grant_found | bool
  loop: "{{ check_oracle_schema_privs | json_query('results[*].{schemapriv:item,grant_found:stdout}') }}"

- name: Remove Oracle Database schema privilege
  shell: |
    set -o pipefail
    source oraenv <<< {{ oracle_sid }} 1>/dev/null
    {{ oracle_home }}/bin/sqlplus -s -L / as sysdba <<-'END_HEREDOC'
    WHENEVER SQLERROR EXIT SQL.SQLCODE
    REVOKE {{ item.schemapriv.sys_priv }} ON SCHEMA {{ item.schemapriv.schema_name }} FROM {{ item.schemapriv.grantee }};
    END_HEREDOC
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
    ORACLE_PDB_SID: "{{ oracle_pdb_name }}"
    PATH: "{{ oracle_home }}/bin:/usr/local/bin:/bin:/usr/bin:/usr/local/sbin:/usr/sbin"
  become: true
  become_user: "{{ oracle_user }}"
  when:
    - item.schemapriv.state | lower == "absent"
    - item.grant_found | bool
  loop: "{{ check_oracle_schema_privs | json_query('results[*].{schemapriv:item,grant_found:stdout}') }}"
