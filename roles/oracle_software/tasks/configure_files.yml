---
- name: Verify file status of SQL*Plus glogin.sql file
  stat:
    path: "{{ oracle_home }}/sqlplus/admin/glogin.sql"
  register: file_status

- name: (check_mode) Add common settings to the SQL*Plus glogin.sql file
  blockinfile:
    path: "{{ oracle_home }}/sqlplus/admin/glogin.sql"
    block: "{{ lookup('file', 'glogin.sql') }}"
    marker: "-- {mark} oracle-database-23-free ANSIBLE MANAGED BLOCK"
    create: true
    owner: "{{ oracle_user }}"
    group: "{{ oracle_install_group }}"
    mode: "u=rw,go="
  check_mode: true
  register: block_check

- name: Un-protect SQL*Plus glogin.sql file to update
  file:
    path: "{{ oracle_home }}/sqlplus/admin/glogin.sql"
    attributes: "-i"
  when:
    - file_status.stat.attr_flags is defined
    - file_status.stat.attr_flags is search("i")
    - block_check.changed

- name: Add common settings to the SQL*Plus glogin.sql file
  blockinfile:
    path: "{{ oracle_home }}/sqlplus/admin/glogin.sql"
    block: "{{ lookup('file', 'glogin.sql') }}"
    marker: "-- {mark} oracle-database-23-free ANSIBLE MANAGED BLOCK"
    create: true
    owner: "{{ oracle_user }}"
    group: "{{ oracle_install_group }}"
    mode: "u=rw,go="
  when: block_check.changed

- name: Protect SQL*Plus glogin.sql after update
  file:
    path: "{{ oracle_home }}/sqlplus/admin/glogin.sql"
    attributes: "+i"
  when: block_check.changed
