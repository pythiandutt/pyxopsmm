---
- name: Ensure ORACLE_BASE exists with correct ownership for 26ai
  file:
    path: "{{ oracle_base | default('/opt/oracle') }}"
    state: directory
    owner: oracle
    group: oinstall
    mode: '0755'
  become: true

- name: Install {{ oracle_db_release }} Free via RPM
  import_tasks: rpm_install.yml

- name: Configure shell
  import_tasks: configure_shell.yml

- name: Configure supporting files
  import_tasks: configure_files.yml

- name: Configure SQLcl
  import_tasks: configure_sqlcl.yml
